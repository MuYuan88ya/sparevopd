dataset_path: inclusionAI/ZoomBench
dataset_kwargs:
  token: true
task: zoombench
test_split: test
output_type: generate_until
doc_to_visual: !function utils.zoombench_doc_to_visual
doc_to_text: !function utils.zoombench_doc_to_text
doc_to_target: !function utils.zoombench_doc_to_target
generation_kwargs:
  max_new_tokens: 32768
  temperature: 0
  top_p: 1.0
  do_sample: false
process_results: !function utils.zoombench_process_results
metric_list:
  - metric: zoombench_accuracy
    aggregation: !function utils.judged_accuracy
    higher_is_better: true
metadata:
  version: 1.0

